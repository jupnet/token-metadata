[package]
name = "spl-token-metadata-interface"
version = "0.8.0"
description = "Solana Program Library Token Metadata Interface"
documentation = "https://docs.rs/spl-token-metadata-interface"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
serde-traits = ["dep:serde", "spl-pod/serde-traits"]

[dependencies]
borsh = "1.5.7"
num-derive = "0.4"
num-traits = "0.2"
serde = { version = "^1.0", optional = true }
solana-borsh = { git = "https://github.com/jupnet/jupnet-sdk", branch = "fix/sdk-deps" }
solana-instruction = { git = "https://github.com/jupnet/jupnet-sdk", branch = "fix/sdk-deps" }
solana-program-error = { git = "https://github.com/jupnet/jupnet-sdk", branch = "fix/sdk-deps", features = ["borsh"] }
solana-pubkey = { git = "https://github.com/jupnet/jupnet-sdk", branch = "fix/sdk-deps", features = ["borsh"] }
spl-discriminator = { git = "https://github.com/jupnet/libraries", branch = "fix/sdk-deps" }
spl-type-length-value = { git = "https://github.com/jupnet/libraries", branch = "fix/sdk-deps" }
spl-pod = { git = "https://github.com/jupnet/libraries", branch = "fix/sdk-deps", features = ["borsh"] }
thiserror = "^2.0"

[dev-dependencies]
serde_json = "^1.0"
solana-sha256-hasher = { git = "https://github.com/jupnet/jupnet-sdk", branch = "fix/sdk-deps" }
spl-token-metadata-interface = { path = ".", features = ["serde-traits"] }

[lib]
crate-type = ["lib"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
